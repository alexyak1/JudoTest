# The deployed nginx config. Serves judoquiz.com over TLS and folds www and
# plain http onto https://judoquiz.com.
#
# It requires a certificate at /etc/letsencrypt/live/judoquiz.com/ to start at
# all -- nginx refuses to boot when ssl_certificate names a missing file. On a
# machine that has no certificate yet, scripts/enable-https.sh writes a
# throwaway self-signed one first so nginx can come up and answer the ACME
# challenge on port 80, then certbot replaces it with the real thing.

# Plain http: keeps answering ACME challenges (renewal needs this), redirects
# everything else. The www -> apex fold happens in the same 301.
server {
    listen 80;
    server_name judoquiz.com www.judoquiz.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://judoquiz.com$request_uri;
    }
}

# https on www: fold onto the apex before serving anything.
server {
    listen 443 ssl;
    http2 on;
    server_name www.judoquiz.com;

    ssl_certificate     /etc/letsencrypt/live/judoquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judoquiz.com/privkey.pem;

    # TLS settings inline rather than `include options-ssl-nginx.conf`: that
    # file ships with the certbot NGINX PLUGIN, which a webroot-only install
    # does not pull in. Depending on it (or on fetching it from GitHub) is a
    # dependency this config does not need.
    #
    # Every cipher here is ECDHE, so no ssl_dhparam is required -- that
    # directive only matters for the DHE suites, which are not offered.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    return 301 https://judoquiz.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name judoquiz.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/judoquiz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judoquiz.com/privkey.pem;

    # TLS settings inline rather than `include options-ssl-nginx.conf`: that
    # file ships with the certbot NGINX PLUGIN, which a webroot-only install
    # does not pull in. Depending on it (or on fetching it from GitHub) is a
    # dependency this config does not need.
    #
    # Every cipher here is ECDHE, so no ssl_dhparam is required -- that
    # directive only matters for the DHE suites, which are not offered.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Deliberately short (1 day) while HTTPS is new. HSTS is cached by the
    # browser and cannot be withdrawn early -- a long max-age set on a setup
    # that turns out to be broken locks users out for that entire duration.
    # Raise to 63072000 (2 years) after a week of trouble-free HTTPS.
    add_header Strict-Transport-Security "max-age=86400" always;

    # Same-origin API. The backend lives in the other compose project and is
    # published on the host's :8787, so we reach it through the host gateway
    # rather than a service name -- the two projects are on separate networks.
    # The trailing slash on proxy_pass strips the /api prefix, so /api/uploads/x
    # reaches the backend as /uploads/x.
    location /api/ {
        proxy_pass http://host.docker.internal:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Uploaded photos and technique video can be large.
        client_max_body_size 32m;
        proxy_buffering off;
    }

    # Enable sendfile for better performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Enable ETags (default in nginx, but explicitly ensure they're used)
    etag on;

    # Open file cache for better performance (optimized for static content)
    # Since images rarely change, we can cache longer
    open_file_cache max=10000 inactive=1h;
    open_file_cache_valid 1h;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Crawler-facing files. Without this they fall through to the SPA catch-all
    # below, so a missing sitemap.xml answered "200 OK" with a page of HTML
    # instead of 404 -- which is how a broken sitemap goes unnoticed.
    location ~* \.(xml|txt|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        # Don't cache HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # add_header does NOT merge across levels: one add_header here discards
        # every add_header inherited from the server block. Without repeating
        # them, HTML responses -- the only ones a browser applies these to --
        # ship with no HSTS and none of the security headers below.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Optimized caching for images (GIF, PNG, JPG, etc.)
    # Since images update rarely (once per month or less), use very aggressive caching
    location ~* \.(gif|png|jpg|jpeg|webp|ico|svg)$ {
        # Cache for 1 year (31536000 seconds)
        expires 1y;
        # Aggressive caching: public (can be cached by CDN/proxies), immutable (never changes)
        add_header Cache-Control "public, immutable, max-age=31536000, stale-while-revalidate=86400";
        add_header Vary "Accept-Encoding";
        # Enable ETags for images (enables conditional requests - 304 Not Modified responses)
        etag on;
        # Access log off for static assets to reduce I/O
        access_log off;
    }

    # Technique videos. Filenames are content-hashed by the build, so they can
    # be cached as immutable. Byte-range requests are on by default, which the
    # modal player needs for seeking.
    location ~* \.(mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Accept-Ranges "bytes";
        etag on;
        access_log off;
    }

    # Cache JavaScript and CSS files
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        etag on;
        access_log off;
    }

    # Cache fonts
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Access-Control-Allow-Origin "*";
        etag on;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
